name: CI

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build et Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Build et tests
        run: ./mvnw -B clean verify -Djava.version=${{ matrix.java }}

      - name: Publier le jar
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      - name: Publier les rapports de Jacoco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: target/site/jacoco

  docker:
    name: Build et Push Docker vers GHCR
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Télécharger l'artefact application-jar
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.REGISTRY }}/${{ vars.GHCR_USER }}/biblio-api:${{ github.ref_name }}

  release:
    name: Créer la release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger l'artefact application-jar
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Créer GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
